<script>

const WORKER_URL =
"https://alert-control.tolediazmaxi.workers.dev";

const estado = {
    dexter: true,
    seven: true
};

function actualizarBotones() {

    document.getElementById("dexterBtn").textContent =
        estado.dexter
            ? "🟢 ACTIVADO"
            : "🔴 DESACTIVADO";

    document.getElementById("sevenBtn").textContent =
        estado.seven
            ? "🟢 ACTIVADO"
            : "🔴 DESACTIVADO";
}

async function cargarEstado() {

    try {

        const response = await fetch(
            "https://maxidztt.github.io/sporting-alert/config_alertas.json?t=" + Date.now()
        );

        const config = await response.json();

        estado.dexter = config.dexter;
        estado.seven = config.seven;

        actualizarBotones();

    } catch (e) {

        console.error(e);

        actualizarBotones();
    }
}

async function guardar() {

    document.getElementById("status").textContent =
        "⏳ Guardando...";

    try {

        const response = await fetch(
            WORKER_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    dexter: estado.dexter,
                    seven: estado.seven
                })
            }
        );

        if (!response.ok) {
            throw new Error(
                "Error al actualizar"
            );
        }

        document.getElementById("status")
            .textContent =
            "✅ Configuración actualizada";

    } catch (e) {

        document.getElementById("status")
            .textContent =
            "❌ Error al guardar";

        console.error(e);
    }
}

document.getElementById("dexterBtn")
    .onclick = async () => {

    estado.dexter = !estado.dexter;

    actualizarBotones();

    await guardar();
};

document.getElementById("sevenBtn")
    .onclick = async () => {

    estado.seven = !estado.seven;

    actualizarBotones();

    await guardar();
};

cargarEstado();

</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Control Center</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    padding: 20px;
}

.card{
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

button{
    width: 100%;
    padding: 12px;
    font-size: 16px;
    cursor: pointer;
}

#status{
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Alert Control Center</h1>

<div class="card">
    <h2>Dexter Alert</h2>
    <button id="dexterBtn">Cargando...</button>
</div>

<div class="card">
    <h2>Seven Alert</h2>
    <button id="sevenBtn">Cargando...</button>
</div>

<div id="status"></div>

<script>

const WORKER_URL =
"https://alert-control.tolediazmaxi.workers.dev";

const estado = {
    dexter: true,
    seven: true
};

function actualizarBotones() {

    document.getElementById("dexterBtn").textContent =
        estado.dexter
            ? "🟢 ACTIVADO"
            : "🔴 DESACTIVADO";

    document.getElementById("sevenBtn").textContent =
        estado.seven
            ? "🟢 ACTIVADO"
            : "🔴 DESACTIVADO";
}

async function cargarEstado() {

    try {

        const response = await fetch(
            "./config_alertas.json?t=" + Date.now()
        );

        const config = await response.json();

        estado.dexter = config.dexter;
        estado.seven = config.seven;

    } catch (error) {

        console.error(
            "Error cargando config_alertas.json:",
            error
        );
    }

    actualizarBotones();
}

async function guardar() {

    document.getElementById("status").textContent =
        "⏳ Guardando...";

    try {

        const response = await fetch(
            WORKER_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    dexter: estado.dexter,
                    seven: estado.seven
                })
            }
        );

        if (!response.ok) {
            throw new Error(
                "Error al actualizar configuración"
            );
        }

        document.getElementById("status").textContent =
            "✅ Configuración actualizada";

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "❌ Error al guardar";
    }
}

document.getElementById("dexterBtn")
    .addEventListener("click", async () => {

        estado.dexter = !estado.dexter;

        actualizarBotones();

        await guardar();
    });

document.getElementById("sevenBtn")
    .addEventListener("click", async () => {

        estado.seven = !estado.seven;

        actualizarBotones();

        await guardar();
    });

cargarEstado();

</script>

</body>
</html>

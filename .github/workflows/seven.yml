name: Seven Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  seven:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restaurar historial
        uses: actions/cache@v4
        with:
          path: sent_offers_seven.json
          key: seven-history-${{ github.run_id }}
          restore-keys: |
            seven-history-

      - name: Ejecutar scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_seven.py

      - name: Guardar historial
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar historial Seven"
          file_pattern: sent_offers_seven.json
